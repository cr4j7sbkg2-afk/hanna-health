<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Hanna Health">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Hanna Health – rendelői felület (teszt)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;600&family=Gilda+Display&family=Karla:wght@400;500;600;700&family=Fraunces:wght@300;400;500&family=Jost:wght@300;400;500;600&display=swap">
<style>
html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; background: #E9E9EE; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
* { -webkit-tap-highlight-color: transparent; }
button, label, input, textarea { touch-action: manipulation; }
#app { height: 100vh; height: 100dvh; }
/* iOS nagyít, ha egy beviteli mező betűmérete 16px alatti */
input, textarea { font-size: 16px !important; }
.boot { margin: 0; padding: calc(40px + env(safe-area-inset-top)) 24px 24px; font: 16px/1.5 -apple-system, system-ui, sans-serif; color: #26294F; text-align: center; }
</style>
</head>
<body>
<div id="app"><p class="boot">Betöltés…</p></div>
<template id="tpl">
<div style="display: flex; flex-wrap: wrap; height: 100%; overflow: hidden; background: {{t.bg}}; color: {{t.text}}; font-family: 'Josefin Sans', sans-serif; font-size: 15px">

  <aside style="flex: 0 0 236px; height: 100%; box-sizing: border-box; padding: 22px 14px 18px; display: flex; flex-direction: column; gap: 6px; background: {{t.primary}}; color: #FFFFFF">
    <div style="display: flex; align-items: center; gap: 10px; padding: 0 8px 18px">
      <svg width="42" height="28" viewBox="0 0 120 80" aria-hidden="true">
        <path d="M30 16A24 24 0 0 0 30 64A31 31 0 0 1 30 16Z" fill="#FFFFFF"></path>
        <circle cx="60" cy="40" r="17" fill="#C9772E"></circle>
        <path d="M90 16A24 24 0 0 1 90 64A31 31 0 0 0 90 16Z" fill="#FFFFFF"></path>
      </svg>
      <div style="display: flex; flex-direction: column; gap: 3px">
        <span style="font-size: 13px; letter-spacing: 0.22em">HANNA HEALTH</span>
        <span style="font-size: 10px; letter-spacing: 0.2em; color: #DADBEA">RENDELŐI FELÜLET</span>
      </div>
    </div>
    <nav aria-label="Rendelői menü" style="display: flex; flex-direction: column; gap: 4px">
      <sc-for list="{{navItems}}" as="ni" hint-placeholder-count="5">
        <button type="button" onClick="{{ni.onPick}}" aria-current="{{ni.current}}" style="min-height: 46px; border: none; border-radius: 12px; background: {{ni.bg}}; color: {{ni.color}}; padding: 0 12px; display: flex; align-items: center; justify-content: space-between; gap: 10px; font-family: inherit; font-size: 15px; font-weight: {{ni.weight}}; text-align: left; cursor: pointer">
          <span>{{ni.label}}</span>
          <sc-if value="{{ni.hasBadge}}" hint-placeholder-val="{{true}}">
            <span style="min-width: 24px; height: 24px; box-sizing: border-box; padding: 0 7px; border-radius: 999px; background: #F2C9A1; color: #26294F; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600">{{ni.badge}}</span>
          </sc-if>
        </button>
      </sc-for>
    </nav>
    <div style="flex: 1 1 auto"></div>
    <div style="display: flex; flex-direction: column; gap: 8px; padding: 14px 8px 0; border-top: 1px solid #4A4D75">
      <span style="font-size: 11px; letter-spacing: 0.18em; color: #DADBEA">SZEREPKÖR</span>
      <div style="display: flex; gap: 4px; padding: 4px; border-radius: 999px; background: #3A3D66">
        <sc-for list="{{roles}}" as="ro" hint-placeholder-count="2">
          <button type="button" onClick="{{ro.onPick}}" aria-pressed="{{ro.pressed}}" style="flex: 1 1 0; min-height: 44px; border: none; border-radius: 999px; background: {{ro.bg}}; color: {{ro.color}}; font-family: inherit; font-size: 13px; font-weight: {{ro.weight}}; cursor: pointer; padding: 0 4px">{{ro.label}}</button>
        </sc-for>
      </div>
      <span style="font-size: 13px; line-height: 1.4; color: #FFFFFF">{{userName}}</span>
      <span style="font-size: 12px; line-height: 1.4; color: #DADBEA">Prototípus: minden név és adat kitalált minta.</span>
    </div>
  </aside>

  <main style="flex: 999 1 560px; min-width: 0; height: 100%; box-sizing: border-box; overflow-y: auto; padding: 28px 32px 32px; display: flex; flex-direction: column; gap: 20px">

    <sc-if value="{{isCal}}" hint-placeholder-val="{{true}}">
      <div style="display: flex; flex-direction: column; gap: 6px">
        <h1 style="margin: 0; font-weight: 300; font-size: 32px; line-height: 1.15; color: {{t.primary}}">Naptár</h1>
        <span style="font-size: 14px; color: {{t.muted}}">{{calSummary}}</span>
      </div>
      <sc-if value="{{isMoving}}" hint-placeholder-val="{{false}}">
        <div role="status" style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px; border-radius: 14px; background: {{t.accentSoft}}">
          <span style="font-size: 14px; line-height: 1.45; color: {{t.text}}">{{moveText}}</span>
          <button type="button" onClick="{{cancelMove}}" style="min-height: 44px; border: 1px solid {{t.primary}}; border-radius: 999px; background: transparent; color: {{t.primary}}; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer; padding: 0 18px">Mégse</button>
        </div>
      </sc-if>
      <div style="display: flex; flex-wrap: wrap; align-items: flex-start; gap: 20px">
        <div style="flex: 1 1 520px; min-width: 0; overflow-x: auto">
          <div style="display: flex; flex-direction: column; gap: 6px; min-width: 620px">
            <div style="display: flex; gap: 6px">
              <div style="flex: 0 0 52px"></div>
              <div style="flex: 1 1 auto; min-width: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px">
                <sc-for list="{{gridHeads}}" as="gh" hint-placeholder-count="5">
                  <div style="min-height: 44px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px">
                    <span style="font-size: 12px; color: {{t.muted}}">{{gh.dow}}</span>
                    <span style="font-size: 14px; font-weight: 600; color: {{t.text}}">{{gh.date}}</span>
                  </div>
                </sc-for>
              </div>
            </div>
            <div style="display: flex; gap: 6px">
              <div style="flex: 0 0 52px; display: flex; flex-direction: column; gap: 6px">
                <sc-for list="{{gridTimes}}" as="gt" hint-placeholder-count="8">
                  <div style="height: 60px; display: flex; align-items: center; font-size: 14px; font-weight: 600; color: {{t.text}}">{{gt.time}}</div>
                </sc-for>
              </div>
              <div style="flex: 1 1 auto; min-width: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); grid-auto-rows: 60px; gap: 6px">
                <sc-for list="{{gridCells}}" as="gc" hint-placeholder-count="10">
                  <button type="button" onClick="{{gc.onPick}}" aria-pressed="{{gc.pressed}}" aria-label="{{gc.aria}}" style="height: 60px; min-width: 0; box-sizing: border-box; border: 2px solid {{gc.border}}; border-radius: 12px; background: {{gc.bg}}; color: {{gc.color}}; padding: 4px 8px; display: flex; flex-direction: column; justify-content: center; gap: 2px; text-align: left; font-family: inherit; cursor: pointer; overflow: hidden">
                    <span style="font-size: 13px; font-weight: {{gc.weight}}; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{gc.l1}}</span>
                    <span style="font-size: 12px; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{gc.l2}}</span>
                  </button>
                </sc-for>
              </div>
            </div>
          </div>
          <div style="display: flex; flex-wrap: wrap; gap: 8px 16px; padding-top: 12px; font-size: 13px; color: {{t.muted}}">
            <sc-for list="{{legend}}" as="lg" hint-placeholder-count="4">
              <span style="display: flex; align-items: center; gap: 6px"><span aria-hidden="true" style="width: 14px; height: 14px; border-radius: 4px; background: {{lg.bg}}; border: 1px solid {{t.border}}"></span>{{lg.label}}</span>
            </sc-for>
          </div>
        </div>

        <div style="flex: 0 1 340px; min-width: 280px; background: {{t.surface}}; border: 1px solid {{t.border}}; border-radius: 18px; padding: 20px; display: flex; flex-direction: column; gap: 12px">
          <sc-if value="{{panelNone}}" hint-placeholder-val="{{false}}">
            <span style="font-size: 16px; font-weight: 600; color: {{t.text}}">Válassz egy időpontot</span>
            <p style="margin: 0; font-size: 14px; line-height: 1.5; color: {{t.muted}}">Foglalásra kattintva érkeztetni, áthelyezni vagy lemondani tudsz. Szabad időpontra kattintva új foglalást vehetsz fel, vagy zárolhatod az időpontot.</p>
          </sc-if>

          <sc-if value="{{panelAppt}}" hint-placeholder-val="{{true}}">
            <div style="display: flex; flex-direction: column; gap: 4px">
              <span style="font-size: 20px; font-weight: 600; color: {{t.text}}">{{sel.name}}</span>
              <span style="font-size: 14px; color: {{t.muted}}">{{sel.svc}} · {{sel.when}}</span>
            </div>
            <div style="display: flex; flex-direction: column; gap: 8px; font-size: 14px">
              <div style="display: flex; justify-content: space-between; gap: 12px"><span style="color: {{t.muted}}">Telefonszám</span><span style="font-weight: 600">[telefonszám]</span></div>
              <div style="display: flex; justify-content: space-between; gap: 12px"><span style="color: {{t.muted}}">Azonosítás</span><span style="font-weight: 600; text-align: right">{{sel.idText}}</span></div>
              <div style="display: flex; justify-content: space-between; gap: 12px"><span style="color: {{t.muted}}">Fizetés</span><span style="font-weight: 600; text-align: right">{{sel.payText}}</span></div>
              <div style="display: flex; justify-content: space-between; gap: 12px"><span style="color: {{t.muted}}">Állapot</span><span style="font-weight: 600; text-align: right">{{sel.stateText}}</span></div>
              <div style="display: flex; justify-content: space-between; gap: 12px"><span style="color: {{t.muted}}">Vizit előtti teendők</span><span style="font-weight: 600; text-align: right">{{sel.prepText}}</span></div>
            </div>
            <sc-if value="{{sel.showPrep}}" hint-placeholder-val="{{false}}">
              <div style="padding: 12px 14px; border-radius: 14px; background: {{t.bg}}; display: flex; flex-direction: column; gap: 8px">
                <span style="font-size: 12px; letter-spacing: 0.14em; color: {{t.muted}}">KÉRDŐÍV (CSAK AZ ORVOS LÁTJA)</span>
                <sc-for list="{{prepRows}}" as="pq" hint-placeholder-count="3">
                  <div style="display: flex; flex-direction: column; gap: 2px">
                    <span style="font-size: 12px; color: {{t.muted}}">{{pq.q}}</span>
                    <span style="font-size: 14px; line-height: 1.45; color: {{t.text}}">{{pq.a}}</span>
                  </div>
                </sc-for>
              </div>
            </sc-if>
            <button type="button" onClick="{{sel.onArrive}}" style="min-height: 48px; border: none; border-radius: 999px; background: {{t.primary}}; color: #FFFFFF; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer; padding: 0 20px">{{sel.arriveLabel}}</button>
            <button type="button" onClick="{{sel.onNoShow}}" style="min-height: 48px; border: 1px solid {{t.primary}}; border-radius: 999px; background: transparent; color: {{t.primary}}; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer; padding: 0 20px">{{sel.noShowLabel}}</button>
            <sc-if value="{{sel.showPayLink}}" hint-placeholder-val="{{false}}">
              <button type="button" onClick="{{sel.onPayLink}}" disabled="{{sel.payLinkBtn.disabled}}" style="min-height: 48px; border: 1px solid {{sel.payLinkBtn.border}}; border-radius: 999px; background: {{sel.payLinkBtn.bg}}; color: {{sel.payLinkBtn.color}}; font-family: inherit; font-size: 15px; font-weight: 600; cursor: {{sel.payLinkBtn.cursor}}; padding: 0 20px">Fizetési link küldése</button>
            </sc-if>
            <button type="button" onClick="{{sel.onMove}}" disabled="{{sel.moveBtn.disabled}}" style="min-height: 48px; border: 1px solid {{sel.moveBtn.border}}; border-radius: 999px; background: {{sel.moveBtn.bg}}; color: {{sel.moveBtn.color}}; font-family: inherit; font-size: 15px; font-weight: 600; cursor: {{sel.moveBtn.cursor}}; padding: 0 20px">Áthelyezés másik időpontra</button>
            <sc-if value="{{sel.showLink}}" hint-placeholder-val="{{true}}">
              <button type="button" onClick="{{sel.onCode}}" disabled="{{sel.linkBtn.disabled}}" style="min-height: 48px; border: 1px solid {{sel.linkBtn.border}}; border-radius: 999px; background: {{sel.linkBtn.bg}}; color: {{sel.linkBtn.color}}; font-family: inherit; font-size: 15px; font-weight: 600; cursor: {{sel.linkBtn.cursor}}; padding: 0 20px">Összekötő kód készítése</button>
            </sc-if>
            <sc-if value="{{sel.hasCode}}" hint-placeholder-val="{{false}}">
              <div style="padding: 14px 16px; border-radius: 14px; background: {{t.accentSoft}}; display: flex; flex-direction: column; gap: 6px">
                <span style="font-size: 12px; letter-spacing: 0.12em; color: {{t.text}}">EGYSZERI ÖSSZEKÖTŐ KÓD</span>
                <span style="font-size: 30px; font-weight: 600; letter-spacing: 0.2em; color: {{t.primary}}">{{sel.code}}</span>
                <span style="font-size: 13px; line-height: 1.45; color: {{t.text}}">15 percig érvényes. Csak azután add át, hogy megnézted a páciens személyi igazolványát és TAJ-kártyáját. A páciens az appban, a Mappám fülön írja be.</span>
              </div>
            </sc-if>
            <sc-if value="{{sel.showRefund}}" hint-placeholder-val="{{false}}">
              <button type="button" onClick="{{sel.onRefund}}" disabled="{{sel.refundBtn.disabled}}" style="min-height: 48px; border: 1px solid {{sel.refundBtn.border}}; border-radius: 999px; background: {{sel.refundBtn.bg}}; color: {{sel.refundBtn.color}}; font-family: inherit; font-size: 15px; font-weight: 600; cursor: {{sel.refundBtn.cursor}}; padding: 0 20px">Előleg visszatérítése</button>
            </sc-if>
            <button type="button" onClick="{{sel.onCancel}}" disabled="{{sel.cancelBtn.disabled}}" style="min-height: 48px; border: 1px solid {{sel.cancelBtn.border}}; border-radius: 999px; background: {{sel.cancelBtn.bg}}; color: {{sel.cancelBtn.color}}; font-family: inherit; font-size: 15px; font-weight: 600; cursor: {{sel.cancelBtn.cursor}}; padding: 0 20px">Időpont lemondása</button>
          </sc-if>

          <sc-if value="{{panelFree}}" hint-placeholder-val="{{false}}">
            <div style="display: flex; flex-direction: column; gap: 4px">
              <span style="font-size: 18px; font-weight: 600; color: {{t.text}}">Új foglalás</span>
              <span style="font-size: 14px; color: {{t.muted}}">{{slotWhen}}</span>
            </div>
            <label for="hh-adm-nbname" style="font-size: 13px; font-weight: 600; color: {{t.text}}">Páciens neve</label>
            <input id="hh-adm-nbname" type="text" value="{{nbName}}" onChange="{{onNbName}}" placeholder="Vezetéknév Keresztnév" style="height: 46px; box-sizing: border-box; padding: 0 14px; border: 1px solid {{t.border}}; border-radius: 12px; background: {{t.surface}}; color: {{t.text}}; font-family: inherit; font-size: 15px">
            <span style="font-size: 13px; font-weight: 600; color: {{t.text}}">Vizsgálat</span>
            <div style="display: flex; flex-wrap: wrap; gap: 6px">
              <sc-for list="{{nbServices}}" as="ns" hint-placeholder-count="6">
                <button type="button" onClick="{{ns.onPick}}" aria-pressed="{{ns.pressed}}" style="min-height: 44px; border-radius: 999px; border: 1px solid {{ns.border}}; background: {{ns.bg}}; color: {{ns.color}}; font-family: inherit; font-size: 13px; font-weight: {{ns.weight}}; cursor: pointer; padding: 0 12px">{{ns.label}}</button>
              </sc-for>
            </div>
            <button type="button" onClick="{{toggleNbNew}}" aria-pressed="{{nbNew.pressed}}" style="width: 100%; min-height: 48px; border: none; background: transparent; padding: 4px 0; display: flex; align-items: center; gap: 12px; text-align: left; font-family: inherit; cursor: pointer">
              <span style="width: 24px; height: 24px; flex-shrink: 0; box-sizing: border-box; border-radius: 7px; border: 2px solid {{t.primary}}; background: {{nbNew.box}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="visibility: {{nbNew.vis}}"><path d="M5 12.5l4.5 4.5L19 7"></path></svg>
              </span>
              <span style="font-size: 14px; line-height: 1.35; color: {{t.text}}">Új páciens (még nincs azonosítva)</span>
            </button>
            <span style="font-size: 13px; line-height: 1.45; color: {{t.muted}}">{{nbPayHint}}</span>
            <button type="button" onClick="{{saveBooking}}" disabled="{{nbSave.disabled}}" style="min-height: 48px; border: 1px solid {{nbSave.border}}; border-radius: 999px; background: {{nbSave.bg}}; color: {{nbSave.color}}; font-family: inherit; font-size: 15px; font-weight: 600; cursor: {{nbSave.cursor}}; padding: 0 20px">Foglalás rögzítése</button>
            <button type="button" onClick="{{toggleBlock}}" disabled="{{blockBtn.disabled}}" style="min-height: 48px; border: 1px solid {{blockBtn.border}}; border-radius: 999px; background: {{blockBtn.bg}}; color: {{blockBtn.color}}; font-family: inherit; font-size: 15px; font-weight: 600; cursor: {{blockBtn.cursor}}; padding: 0 20px">Időpont zárolása</button>
          </sc-if>

          <sc-if value="{{panelBlocked}}" hint-placeholder-val="{{false}}">
            <div style="display: flex; flex-direction: column; gap: 4px">
              <span style="font-size: 18px; font-weight: 600; color: {{t.text}}">Zárolt időpont</span>
              <span style="font-size: 14px; color: {{t.muted}}">{{slotWhen}}</span>
            </div>
            <p style="margin: 0; font-size: 14px; line-height: 1.5; color: {{t.muted}}">A páciensek ezt az időpontot nem látják és nem foglalhatják.</p>
            <button type="button" onClick="{{toggleBlock}}" disabled="{{blockBtn.disabled}}" style="min-height: 48px; border: 1px solid {{blockBtn.border}}; border-radius: 999px; background: {{blockBtn.bg}}; color: {{blockBtn.color}}; font-family: inherit; font-size: 15px; font-weight: 600; cursor: {{blockBtn.cursor}}; padding: 0 20px">Zárolás feloldása</button>
          </sc-if>

          <sc-if value="{{calDenied}}" hint-placeholder-val="{{false}}">
            <span style="font-size: 12px; line-height: 1.45; color: {{t.muted}}">A szürke gombokhoz ebben a szerepkörben nincs jogosultság. Az orvos a Jogosultságok menüben tudja engedélyezni.</span>
          </sc-if>
          <sc-if value="{{hasCalNote}}" hint-placeholder-val="{{false}}">
            <p role="status" style="margin: 0; padding: 12px 14px; border-radius: 12px; background: {{t.track}}; font-size: 13px; line-height: 1.45; color: {{t.text}}">{{calNote}}</p>
          </sc-if>
        </div>
      </div>
    </sc-if>

    <sc-if value="{{isMsgs}}" hint-placeholder-val="{{false}}">
      <div style="display: flex; flex-direction: column; gap: 6px">
        <h1 style="margin: 0; font-weight: 300; font-size: 32px; line-height: 1.15; color: {{t.primary}}">Üzenetek</h1>
        <span style="font-size: 14px; color: {{t.muted}}">Csak azonosított páciens írhat. Nem sürgősségi csatorna; vállalt válaszidő: [X] munkanap.</span>
      </div>
      <sc-if value="{{subOn}}" hint-placeholder-val="{{false}}">
        <p role="status" style="margin: 0; max-width: 860px; padding: 12px 16px; border-radius: 14px; background: {{t.accentSoft}}; font-size: 14px; line-height: 1.45; color: {{t.text}}">{{subBanner}}</p>
      </sc-if>
      <sc-if value="{{msgsLocked}}" hint-placeholder-val="{{false}}">
        <div style="max-width: 560px; background: {{t.surface}}; border: 1px solid {{t.border}}; border-radius: 18px; padding: 24px; display: flex; flex-direction: column; gap: 10px">
          <span style="font-size: 18px; font-weight: 600; color: {{t.text}}">Az orvosi üzeneteket csak az orvos látja</span>
          <p style="margin: 0; font-size: 14px; line-height: 1.5; color: {{t.muted}}">Az adminisztrátor az időpontokat, az azonosítást és a fizetést kezeli a Naptárban. Az üzenetek egészségügyi adatot tartalmaznak, ezért a tartalmukhoz ebben a szerepkörben nincs hozzáférés, és ez a jogosultság nem is adható meg.</p>
          <span style="font-size: 14px; font-weight: 600; color: {{t.text}}">{{lockedCount}}</span>
        </div>
      </sc-if>
      <sc-if value="{{msgsOpen}}" hint-placeholder-val="{{true}}">
        <div style="display: flex; flex-wrap: wrap; align-items: flex-start; gap: 20px">
          <div style="flex: 0 1 320px; min-width: 260px; background: {{t.surface}}; border: 1px solid {{t.border}}; border-radius: 18px; overflow: hidden">
            <sc-for list="{{threads}}" as="th" hint-placeholder-count="4">
              <button type="button" onClick="{{th.onOpen}}" aria-pressed="{{th.pressed}}" style="width: 100%; min-height: 72px; box-sizing: border-box; border: none; border-bottom: 1px solid {{t.border}}; background: {{th.bg}}; padding: 12px 16px; display: flex; flex-direction: column; gap: 4px; text-align: left; font-family: inherit; cursor: pointer; color: {{t.text}}">
                <span style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
                  <span style="font-size: 15px; font-weight: {{th.weight}}">{{th.name}}</span>
                  <span style="padding: 3px 9px; border-radius: 999px; background: {{th.tagBg}}; color: {{th.tagColor}}; font-size: 12px; font-weight: 600">{{th.tag}}</span>
                </span>
                <span style="font-size: 13px; line-height: 1.4; color: {{t.muted}}">{{th.snippet}}</span>
              </button>
            </sc-for>
          </div>
          <div style="flex: 1 1 420px; min-width: 0; background: {{t.surface}}; border: 1px solid {{t.border}}; border-radius: 18px; padding: 20px; display: flex; flex-direction: column; gap: 14px">
            <div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px">
              <div style="display: flex; flex-direction: column; gap: 2px">
                <span style="font-size: 18px; font-weight: 600; color: {{t.text}}">{{thread.name}}</span>

    <sc-if value="{{isMod}}" hint-placeholder-val="{{false}}">

            </div>
            <p style="margin: 0; font-size: 15px; line-height: 1.5; color: {{t.text}}">{{mi.text}}</p>

            <sc-if value="{{mi.isCrisis}}" hint-placeholder-val="{{false}}">
              <p style="margin: 0; padding: 12px 14px; border-radius: 12px; background: {{t.accentSoft}}; font-size: 13px; line-height: 1.5; color: {{t.text}}">Válság-protokoll: a hozzászólás rejtve marad, a szerző azonnal megkapta a segélyvonalak elérhetőségét (Lelki Elsősegély 116-123, vészhelyzetben 112). Moderátorként ne adj tanácsot, hanem értesítsd az orvost. Lezárni csak az orvos tudja.</p>

            <sc-if value="{{mi.isPending}}" hint-placeholder-val="{{true}}">

                </sc-if>
                <button type="button" onClick="{{mi.onHide}}" disabled="{{mi.hideBtn.disabled}}" style="min-height: 44px; border: 1px solid {{mi.hideBtn.border}}; border-radius: 999px; background: {{mi.hideBtn.bg}}; color: {{mi.hideBtn.color}}; font-family: inherit; font-size: 14px; font-weight: 600; cursor: {{mi.hideBtn.cursor}}; padding: 0 18px">{{mi.hideLabel}}</button>

<script>

const SEED = {"articles":[{"id":"pcos","title":"PCOS: gyakori, kezelhető, és lehet mellette gyerek","stat":"A fogamzóképes nők 10–13%-át érinti","short":"Sok nő évekig nem tud róla. Kezeléssel a legtöbben teherbe esnek, csak a terhesség alatt kell jobban figyelni.","lead":"A policisztás ovárium szindróma (PCOS) a fogamzóképes nők egyik leggyakoribb hormonális állapota. Nem jelenti azt, hogy nem lehet gyereked: kezeléssel a legtöbb nő teherbe esik.","sections":[["Mennyire gyakori?","A WHO szerint a fogamzóképes korú nők 10–13 százalékát érinti, és az érintettek akár 70 százaléka nem tud róla. Akkor állapítható meg, ha három jel közül legalább kettő fennáll: rendszertelen vagy elmaradó menstruáció; magasabb férfihormon-szint vagy annak jelei, például erősebb szőrnövekedés, pattanások; policisztás petefészek-kép. Előbb azonban más okokat ki kell zárni."],["Lehet gyerekem?","Igen. A nemzetközi PCOS-ajánlás szerint a terhesség gyakran sikeresen elérhető, természetes úton vagy segítséggel. Ha nincs rendszeres peteérés, első lépésként gyógyszeres peteérés-serkentés jön szóba, és ha ez nem elég, további lehetőségek is vannak."],["Mire kell figyelni terhesség alatt?","PCOS-szel gyakoribb a terhességi cukorbetegség, a magas vérnyomás és a preeclampsia, a koraszülés és a túlzott súlygyarapodás. Az ajánlás szerint ezért a PCOS-t jelezni kell a terhesgondozásban. Cukorterheléses vizsgálat (OGTT) javasolt már a babatervezéskor vagy az első vizsgálaton, majd a 24–28. héten is."],["Mi segít?","Nincs egyetlen „PCOS-diéta”: az ajánlás szerint egyik étrendtípus sem jobb a másiknál. A lényeg a kiegyensúlyozott táplálkozás és a rendszeres mozgás. Akinél indokolt, már 5 százalékos testsúlycsökkenés is érezhető javulást hozhat, és gyakrabban helyreáll a peteérés."]],"watch":["Rendszeresen, 1–3 évente ellenőriztesd a vércukrodat: PCOS-szel nagyobb a 2-es típusú cukorbetegség kockázata.","Ha babát tervezel, a terhesség előtt beszéld meg orvosoddal a cukorterheléses vizsgálatot és a vérnyomásodat.","A lelki egészséged is számít: szorongás vagy lehangoltság esetén kérj segítséget, mert ez PCOS mellett gyakoribb."],"doctor":"Ha a menstruációd rendszertelen vagy hónapokig elmarad, ha erősebb a szőrnövekedésed vagy makacs a pattanásod, vagy ha 35 év alatt egy éve, 35 év felett fél éve sikertelenül próbálkoztok.","sources":[["WHO: policisztás ovárium szindróma (2026)","https://www.who.int/news-room/fact-sheets/detail/polycystic-ovary-syndrome"],["Nemzetközi PCOS-ajánlás, Teede és mtsai, Human Reproduction 2023","https://eprints.soton.ac.uk/484749/1/dead156.pdf"],["NHS Wales: PCOS","https://111.wales.nhs.uk/encyclopaedia/p/article/polycysticovarysyndrome/"],["Samarasinghe és mtsai, Human Reproduction 2026: fogyás és peteérés","https://pure.ulster.ac.uk/en/publications/ovulatory-recovery-following-weight-loss-in-women-with-polycystic/"]]},{"id":"ir","title":"Inzulinrezisztencia: nem kell tiltólista, de figyelni kell rá","stat":"PCOS mellett a nők többségénél kimutatható","short":"Nem kell szigorú diéta. A terhesség előtt és alatt viszont fontos a vércukor ellenőrzése.","lead":"Inzulinrezisztenciáról akkor beszélünk, ha a szervezet nem reagál megfelelően az inzulinra. Magyarországon sokan foglalkoznak vele, és sok az ellentmondó tanács. A jó hír: a legtöbb esetben az általános egészséges életmód a legjobb kezelés.","sections":[["Mennyire gyakori?","PCOS-ben kulcsjellemzőnek számít. Egy vizsgálatban a normál testsúlyú PCOS-es nők 75, a túlsúlyosak 95 százalékánál mutatták ki, de a PCOS nélküli túlsúlyos nők 62 százalékánál is jelen volt."],["Betegség vagy állapot?","Az inzulinrezisztencia sok állapotot kísér, és ha nem foglalkozunk vele, növeli a prediabétesz és a 2-es típusú cukorbetegség kockázatát. A nemzetközi PCOS-ajánlás a rutinszerű inzulinmérést nem javasolja: a vércukor-anyagcsere megítélésére a cukorterheléses vizsgálat (OGTT) az ajánlott. A HOMA-index határértékeiről a hazai szakmai források sem egységesek."],["Lehet gyerekem?","Igen. Az inzulinrezisztencia önmagában nem akadálya a teherbeesésnek, de növelheti a terhességi cukorbetegség kockázatát. Ezért babatervezéskor és a terhesség alatt fontos a vércukor ellenőrzése."],["Kell „IR-diéta”?","A Magyar Dietetikusok Országos Szövetsége szerint az IR-étrend fő elemei ugyanazok, mint amit minden egészséges embernek javasolnak. A Semmelweis Egyetem dietetikusa szerint IR mellett sincs tiltólistás gyümölcs, a mennyiség számít. Testsúlyfelesleg esetén már 5–7 százalékos fogyás is csökkenti a cukorbetegség kockázatát."]],"watch":["Ne kezdj szigorú, sok mindent tiltó diétába orvosi vagy dietetikusi javaslat nélkül.","A rendszeres mozgás az egyik leghatékonyabb eszköz.","Babatervezéskor és a terhesség alatt kérd a vércukor ellenőrzését."],"doctor":"Ha PCOS-ed van, ha korábban volt terhességi cukorbetegséged, ha a családodban gyakori a cukorbetegség, vagy ha babát tervezel, és tudni szeretnéd, hogyan áll a vércukrod.","sources":[["NIDDK: prediabétesz és inzulinrezisztencia","https://www.niddk.nih.gov/health-information/diabetes/overview/what-is-diabetes/prediabetes-insulin-resistance"],["Nemzetközi PCOS-ajánlás, Teede és mtsai, Human Reproduction 2023","https://eprints.soton.ac.uk/484749/1/dead156.pdf"],["Stepto és mtsai, Human Reproduction 2013","https://vu-9.eprints-hosting.org/21733/1/Human%20Reproduction%202013%20Post-print%20.pdf"],["MDOSZ: az inzulinrezisztencia és a PCOS életmódi kezelése","https://mdosz.hu/inzulinrezisztencia-es-policisztasovarium-szindroma-eletmodi-kezelese/"],["Semmelweis Egyetem (2025): gyümölcs inzulinrezisztencia mellett","https://semmelweis.hu/mediasarok/2025/08/04/ne-feljunk-a-termeszetes-edessegektol-egyunk-gyumolcsot/"],["Winkler G., Orvosi Hetilap 2020","https://real.mtak.hu/151397/"]]},{"id":"endo","title":"Endometriózis: a nagyon fájdalmas menstruáció nem „normális”","stat":"Minden 10. fogamzóképes nőt érint","short":"Átlagosan évekig tart, mire kiderül. A legtöbb érintett természetes úton is teherbe eshet.","lead":"Endometriózisban a méh nyálkahártyájához hasonló szövet a méhen kívül is megjelenik, és fájdalmat okozhat. Gyakori, mégis sokszor évekig nem ismerik fel, mert a fájdalmas menstruációt sokan természetesnek tartják.","sections":[["Mennyire gyakori?","A WHO becslése szerint világszerte a fogamzóképes korú nők kb. 10 százalékát, mintegy 190 millió nőt érint. Magyarországon a Semmelweis Egyetem 2018-as becslése szerint csaknem 200 ezer nőt. A diagnózisig átlagosan 4–12 év telik el."],["Milyen tünetei vannak?","Erős menstruációs fájdalom és vérzés, tartós kismedencei fájdalom, puffadás, hányinger, fájdalmas együttlét, valamint a menstruációhoz kötődő bél- vagy vizelési panaszok. Előfordul, hogy csak a meddőség kivizsgálásakor derül ki."],["Lehet gyerekem?","A legtöbb érintettnek igen. Az endometriózissal élő nők egy részénél nehezebb a teherbeesés, de egy brit betegszervezet szerint 60–70 százalékuk természetes úton is teherbe eshet, és akinek kell, annak a meddőségi kezelés is segíthet."],["Mire kell figyelni terhesség alatt?","Az európai szakmai ajánlás szerint az első trimeszterben valamivel nagyobb lehet a vetélés és a méhen kívüli terhesség kockázata, ezért erről érdemes a terhesgondozás elején beszélni. Csak azért viszont nem javasolt teherbe esni, hogy a tünetek enyhüljenek."]],"watch":["Ha a menstruációs fájdalom miatt kimaradsz a munkából vagy a programjaidból, az nem „normális”: érdemes kivizsgáltatni.","Vezess fájdalomnaplót: segít az orvosnak a diagnózisban.","Ha babát tervezel, beszéld meg orvosoddal az időzítést és a lehetőségeket."],"doctor":"Ha tartós kismedencei fájdalmad van, ha a menstruációs fájdalom megnehezíti a mindennapjaidat, ha fáj az együttlét, ha a menstruációhoz kötődő bél- vagy vizelési panaszaid vannak, vagy ha ezek mellett nem sikerül teherbe esni.","sources":[["WHO: endometriózis","https://www.who.int/news-room/fact-sheets/detail/endometriosis"],["Semmelweis Egyetem (2018): csaknem 200 ezer nőt érint az endometriózis","https://semmelweis.hu/hirek/2018/03/20/csaknem-200-ezer-not-erint-az-endometriozis-idehaza/"],["NICE NG73: endometriózis","https://www.nice.org.uk/guidance/NG73/chapter/context"],["ESHRE endometriózis-ajánlás (2022)","https://eprints.soton.ac.uk/492366/1/hoac009.pdf"],["Endometriosis UK: termékenység és terhesség","https://www.endometriosis-uk.org/endometriosis-fertility-and-pregnancy"]]},{"id":"infertility","title":"Ha nem jön a baba: sokkal több párt érint, mint gondolnád","stat":"Minden 6. ember érintett élete során (WHO)","short":"Nem ritka, és nem csak a nőn múlik. Mikor érdemes kivizsgálást kérni, és mire számíts.","lead":"Meddőségről akkor beszélünk, ha 12 hónapnyi rendszeres, védekezés nélküli együttlét után sem jön létre terhesség. Sokkal gyakoribb, mint gondolnánk, és sokféle segítség létezik.","sections":[["Mennyire gyakori?","A WHO 2023-as jelentése szerint a felnőttek kb. 17,5 százaléka, nagyjából minden hatodik ember tapasztal élete során meddőséget. Ugyanakkor a 40 év alatti nők párjainak több mint 80 százalékánál egy éven belül létrejön a terhesség."],["Nem csak a nőn múlik","A meddő párok nagyjából felénél részben vagy egészben férfioldali ok is szerepet játszik. Ezért a kivizsgálás mindig a pár mindkét tagjára kiterjed."],["Mikor kérj kivizsgálást?","Az amerikai reprodukciós társaság (ASRM) szerint 35 év alatt egy év, 35 év felett fél év sikertelen próbálkozás után. Ismert kockázat esetén, például rendszertelen ciklus, endometriózis vagy korábbi kismedencei műtét után, nem kell kivárni ezt az időt."]],"watch":["A kivizsgálásra együtt menjetek: a férfi oldal vizsgálata egyszerű, és sokat számít.","Kerüljétek a dohányzást, és mindketten figyeljetek az egészséges életmódra.","A várakozás lelkileg megterhelő: kérj segítséget, ha nehéz, nem vagy egyedül vele."],"doctor":"Ha 35 év alatt egy éve, 35 év felett fél éve próbálkoztok eredmény nélkül, vagy már korábban, ha rendszertelen a ciklusod, nagyon fájdalmas a menstruációd, vagy ismert nőgyógyászati betegséged van.","sources":[["WHO (2023): minden hatodik embert érint a meddőség","https://www.who.int/news/item/04-04-2023-1-in-6-people-globally-affected-by-infertility"],["WHO: meddőség","https://www.who.int/news-room/fact-sheets/detail/infertility"],["ASRM (2023): a meddőség meghatározása","https://prod.asrm.org/globalassets/_asrm/practice-guidance/practice-guidelines/pdf/definition-of-infertility.pdf"],["NICE NG257 (2026): termékenységi problémák","https://www.nice.org.uk/guidance/ng257/resources/fertility-problems-assessment-and-treatment-pdf-66144022104517"],["AUA/ASRM: férfi meddőség","https://auanet.org/documents/Guidelines/PDF/2024%20Guidelines/Male%20Infertility%20Unabridged%20Final.pdf"]]},{"id":"thyroid","title":"Pajzsmirigy és babavárás","stat":"Minden 8. nőnél kialakul pajzsmirigybetegség","short":"Gyakori, jól kezelhető, és beállított kezeléssel nem akadálya a gyerekvállalásnak.","lead":"A pajzsmirigy-alulműködés és leggyakoribb oka, a Hashimoto-betegség, sokkal gyakoribb nőknél, mint férfiaknál. Jól kezelhető: a cél az, hogy a fogantatás előtt és a terhesség alatt is jól be legyen állítva.","sections":[["Mennyire gyakori?","A Hashimoto-betegség nőknél 4–10-szer gyakoribb, mint férfiaknál, és leginkább 30 és 50 éves kor között kezdődik. Az Amerikai Pajzsmirigy Társaság szerint minden nyolcadik nőnél kialakul valamilyen pajzsmirigybetegség élete során."],["Lehet gyerekem?","Igen. A kezeletlen alulműködés megnehezítheti a teherbeesést, és növelheti a vetélés és a koraszülés kockázatát. Ezért fontos, hogy a pajzsmirigy már a fogantatás előtt jól be legyen állítva, és ez kezeléssel jól elérhető."],["Mi változik a terhesség alatt?","Aki már szed pajzsmirigyhormont, annál a terhesség elején gyakran emelni kell az adagot, ezért a terhesség első felében nagyjából négyhetente ellenőrzik a TSH-szintet. Szülés után a nők kb. 5–10 százalékánál átmeneti pajzsmirigygyulladás alakulhat ki, amely többnyire 12–18 hónap alatt rendeződik."]],"watch":["Ha pajzsmirigyhormont szedsz, a pozitív teszt után ne várj a következő vizsgálatig: még aznap jelezd orvosodnak.","Az adagot ne módosítsd magadtól, csak orvosi utasításra.","Babatervezéskor kérj TSH-vizsgálatot, ha korábban volt pajzsmirigyproblémád.","Szülés után kb. 6 héttel érdemes újra ellenőriztetni."],"doctor":"Ha tartós fáradtságot, hízást, hidegérzékenységet vagy rendszertelen ciklust tapasztalsz, illetve ha pajzsmirigybeteg vagy, és babát tervezel vagy várandós lettél.","sources":[["NIDDK: Hashimoto-betegség","https://niddk.nih.gov/health-information/endocrine-diseases/hashimotos-disease"],["American Thyroid Association: tényadatok","https://www.thyroid.org/wp-content/uploads/2026/01/ATA-Thyroid-Fact-Sheet-2.pdf"],["ATA: pajzsmirigy és terhesség, 2017-es ajánlás összefoglalója","https://thyroid.org/patient-thyroid-information/ct-for-patients/may-2017/vol-10-issue-5-p-3-7"],["ATA: alulműködés kezelése terhesség alatt","https://www.thyroid.org/management-hypothyroidism-pregnancy/"],["ATA: szülés utáni pajzsmirigygyulladás","https://www.thyroid.org/postpartum-thyroiditis"]]},{"id":"hpv","title":"HPV: szinte mindenkit érint, és többnyire magától elmúlik","stat":"A legtöbb nő és férfi élete során elkapja","short":"A pozitív HPV-eredmény nem rák. A rendszeres szűrés és az oltás a legjobb védelem.","lead":"A HPV-fertőzés annyira gyakori, hogy a legtöbb ember élete során átesik rajta. A fertőzések többsége tünetmentes, és két éven belül magától elmúlik.","sections":[["Mennyire gyakori?","A WHO szerint a legtöbb nő és férfi élete során megfertőződik HPV-vel. A fertőzések többsége semmilyen tünetet nem okoz, és két éven belül kezelés nélkül meggyógyul."],["Mi a kapcsolat a méhnyakrákkal?","A méhnyakrákos esetek 99 százaléka HPV-fertőzéssel függ össze, de fordítva ez nem igaz: a fertőzöttek túlnyomó többségénél nem alakul ki rák. A tartósan megmaradó fertőzés okozhat sejtelváltozást, és ezt a szűrés még a rák előtti szakaszban felismeri."],["Lehet gyerekem?","Igen, a HPV önmagában nem akadálya a terhességnek, és a szűrést terhesség alatt is folytatni kell. Ha méhnyak-elváltozás miatt kúpkimetszésed (konizációd) volt, a koraszülés kockázata valamivel nagyobb, ezért ezt jelezd a terhesgondozás elején."],["Oltás és szűrés Magyarországon","Az iskolai programban a 7. évfolyamos, 12. életévüket betöltött lányok 2014 óta, a fiúk a 2020/21-es tanévtől ingyen kaphatnak HPV elleni oltást. A szervezett méhnyakszűrés 25 és 65 év között háromévente javasolt."]],"watch":["Járj rendszeresen méhnyakszűrésre, akkor is, ha be vagy oltva.","Egy pozitív HPV-eredmény nem diagnózis: a további teendőket az orvosod beszéli meg veled.","Ha volt konizációd, jelezd a terhesgondozás kezdetén."],"doctor":"Ha esedékes vagy elmaradt a szűrésed, ha szokatlan vérzést tapasztalsz (például együttlét után), vagy ha kóros szűrési eredményt kaptál.","sources":[["WHO Európa: HPV","https://www.who.int/europe/news-room/fact-sheets/item/human-papillomavirus-(hpv)"],["Nógrád Vármegyei Kormányhivatal: HPV elleni iskolai oltás","https://kormanyhivatalok.hu/kormanyhivatalok/nograd/megye/hirek/hir/hpv-okozta-betegsegek-megelozhetok-0"],["Csákvári és mtsai (2023): a méhnyakrák hazai adatai","https://real.mtak.hu/170055/1/assessing-the-changes-of-epidemiological-indicators-of-cervical-cancer-in-hungary-and-on-international-scale-between-2000-and-2019.pdf"],["Kyrgiou és mtsai, BMJ 2016: konizáció és koraszülés","https://eprints.lancs.ac.uk/id/eprint/82281"]]},{"id":"myoma","title":"Mióma: nagyon gyakori, és többnyire nem okoz gondot","stat":"50 éves korra a nők 70–80%-ánál kimutatható","short":"Sokszor csak véletlenül derül ki. A legtöbb mióma nem igényel kezelést.","lead":"A mióma a méh izomzatának jóindulatú csomója. Ultrahanggal 50 éves korra a nők nagy többségénél kimutatható, de csak egy részüknek okoz panaszt.","sections":[["Mennyire gyakori?","Egy nagy amerikai vizsgálat szerint 50 éves korra a fehér nők közel 70, a fekete nők több mint 80 százalékánál alakul ki mióma. Panaszt a nők 20–50 százalékánál okoz."],["Lehet gyerekem?","A legtöbb mióma nem igényel kezelést. A teherbeesést főleg a méh üregébe domborodó (szubmukózus) mióma nehezítheti; ennek eltávolítása javíthatja az esélyeket. A méh falában lévő miómák eltávolítása a vizsgálatok szerint nem javította a teherbeesési arányokat."],["Mire kell figyelni terhesség alatt?","Miómával valamivel gyakoribb a farfekvés, a korai burokrepedés, a koraszülés és a szülés utáni vérzés, és gyakrabban kerül sor császármetszésre. Ezért ilyenkor gyakoribb ellenőrzés javasolt. A magzat növekedését a mióma a jelek szerint nem korlátozza."]],"watch":["A tünetmentes mióma általában csak rendszeres ultrahangos ellenőrzést igényel.","Ha erős a menstruációd, kérj vérképet: az erős vérzés vashiányhoz vezethet.","Babatervezés előtt beszéld meg orvosoddal, hol helyezkedik el a mióma."],"doctor":"Ha a menstruációd erős vagy elhúzódó, ha a ciklusok között vérzel, ha nyomást, teltségérzést vagy kismedencei fájdalmat érzel, vagy ha fáradékony, sápadt vagy, mert ez vérszegénység jele lehet.","sources":[["Baird és mtsai, Am J Obstet Gynecol 2003","https://scholars.duke.edu/publication/769704"],["American Family Physician (2017): a mióma ellátása","https://www.aafp.org/afp/2017/0115/p100.pdf"],["ASRM betegtájékoztató: mióma","https://reproductivefacts.org/globalassets/_rf/news-and-publications/bookletsfact-sheets/english-pdf/what_are_fibroids-factsheet.pdf"],["NICHD: mióma","https://nichd.nih.gov/sites/default/files/2024-07/NICHD_WH_fibroids_webOP.pdf"]]},{"id":"iron","title":"Vashiány: fáradtság, ami mögött gyakran más áll","stat":"Világszerte minden 3. nő vérszegény","short":"Fáradtság, sápadtság, hajhullás: gyakran vashiány áll mögötte, és egy vérvétellel kiderül.","lead":"A vérszegénység leggyakoribb táplálkozási oka a vashiány. Az erős menstruáció és a terhesség a két leggyakoribb kiváltó ok, ezért nőknél sokkal gyakoribb. Egyszerű vérvétellel kiderül, és jól kezelhető.","sections":[["Mennyire gyakori?","A WHO 2023-as becslése szerint világszerte a 15–49 éves nők 30,7 százaléka, a várandósok 35,5 százaléka vérszegény. A vérszegénység nem mindig vashiány, de ez a leggyakoribb oka."],["Milyen tünetei vannak?","Fáradtság, gyengeség, szédülés, álmosság, terheléskor jelentkező légszomj, szívdobogás-érzés, sápadt bőr, fejfájás és hajhullás."],["Miért fontos terhesség alatt és után?","A súlyos vashiányos vérszegénység növeli a koraszülés kockázatát, és összefügg az alacsony születési súllyal és a szülés utáni depresszióval. Ezért a terhesség alatt fontos a vérkép ellenőrzése."]],"watch":["Ha erős a menstruációd, kérj vérképet: ez a leggyakoribb ok.","Vaskészítményt ne szedj találomra: előbb vérvétel mutassa meg, valóban vashiány áll-e a panaszok mögött.","Szülés után a tartós fáradtság nem mindig csak a kialvatlanság: érdemes ellenőriztetni."],"doctor":"Ha tartósan fáradt vagy szédülékeny vagy, ha terheléskor hamar kifulladsz, vagy ha a menstruációd nagyon erős, például éjszaka is cserélned kell, vagy nagy alvadékok távoznak.","sources":[["WHO: vérszegénység nők és gyermekek körében (2023)","https://www.who.int/data/gho/data/themes/topics/anaemia_in_women_and_children"],["WHO: vérszegénység","https://www.who.int/Health-Topics/Anaemia"],["HSE (Írország): vashiányos vérszegénység","https://www.hse.ie/conditions/iron-deficiency-anaemia/"],["Mayo Clinic: vérszegénység terhesség alatt","https://mayoclinic.org/healthy-lifestyle/pregnancy-week-by-week/in-depth/anemia-during-pregnancy/art-20114455"],["NICE NG88: erős menstruációs vérzés","https://nice.org.uk/guidance/ng88/chapter/recommendations"]]},{"id":"ppd","title":"Szülés utáni depresszió: gyakori, és nem a te hibád","stat":"A frissen szült nők kb. 13%-át érinti","short":"Nem gyengeség és nem rossz anyaság jele. Kezelhető, és minél előbb kérsz segítséget, annál jobb.","lead":"A szülés utáni hetekben sok nő sírékony és kimerült, ez többnyire két héten belül elmúlik. Ha a lehangoltság tartós, az már betegség lehet, amely gyakori, és jól kezelhető.","sections":[["Mennyire gyakori?","A WHO szerint a frissen szült nők kb. 13 százalékánál, a várandósok kb. 10 százalékánál alakul ki lelki betegség, elsősorban depresszió."],["Miben más, mint a baby blues?","A szülés utáni első napok sírékonysága általában két héten belül magától elmúlik. Ha a lehangoltság, a reménytelenség vagy a szorongás ennél tovább tart, vagy egyre erősebb, érdemes szakemberrel beszélni."],["Mi segít?","A szülés utáni depresszió kezelhető. Az első lépés, hogy beszélj róla: az orvosoddal, a védőnővel vagy egy szakemberrel. A kezelést mindig személyre szabják, szoptatás mellett is van megoldás."]],"watch":["Mondd el a környezetednek, ha nem érzed jól magad: a segítségkérés nem kudarc.","Pihenj, amikor tudsz, és fogadd el a felajánlott segítséget.","Ha korábban volt depressziód, ezt már a terhesség alatt jelezd orvosodnak."],"doctor":"Ha a lehangoltság két hétnél tovább tart, ha nem tudod ellátni magad vagy a babát, vagy ha nem érzel örömet semmiben. Ha bántanád magad vagy a babát, azonnal kérj segítséget: hívd a 112-t, vagy a Lelki Elsősegély Telefonszolgálatot a 116-123 számon.","sources":[["WHO: az anyák lelki egészsége","https://www.who.int/teams/mental-health-and-substance-use/promotion-prevention/maternal-mental-health"],["Telefonos Lelki Elsősegély Szolgálat, 116-123","https://findahelpline.com/organizations/telefonos-lelki-elsosegely-szolgalat"]]},{"id":"pelvic","title":"Vizeletcsepegés szülés után: gyakori, és lehet rajta segíteni","stat":"A szült nők kb. negyedét érinti","short":"Nem kell szégyellni, és nem kell beletörődni: a medencefenék erősítése sokat segíthet.","lead":"Köhögéskor, nevetéskor vagy ugráskor elcseppenő vizelet a szülés után nagyon gyakori. Sokan szégyellik, ezért nem beszélnek róla, pedig jó eséllyel javítható.","sections":[["Mennyire gyakori?","Egy 2023-as összesítő elemzés szerint a szülés után a nők kb. 26 százalékánál fordul elő vizeletinkontinencia."],["Mi segít?","A medencefenék izmainak célzott erősítése sokat javíthat, különösen ha gyógytornász mutatja meg a helyes technikát. A legtöbb nőnek ez az első lépés, és sokaknál elég is."],["Elmúlik magától?","Sokaknál a szülés utáni hónapokban javul, de ha nem, nem kell beletörődni. Érdemes szólni róla a gyermekágyi kontrollon."]],"watch":["Szólj róla a gyermekágyi kontrollon, akkor is, ha kínos.","A medencefenék-tornát érdemes gyógytornásszal elkezdeni, hogy jól csináld.","Ne igyál kevesebbet a csepegés miatt: ez inkább ront a helyzeten."],"doctor":"Ha a csepegés a szülés után hónapokkal sem javul, ha erős vizelési ingert, fájdalmat vagy égő érzést tapasztalsz, vagy ha a hüvelyben nyomást, „leereszkedést” érzel.","sources":[["Dai és mtsai, BMC Pregnancy and Childbirth 2023","https://ouci.dntb.gov.ua/works/42QE1qW7"]]},{"id":"perimeno","title":"Perimenopauza: nem képzelődés, és nem kell kibírni","stat":"Minden 2. nőnél panaszokkal jár","short":"Hőhullám, alvászavar, hangulatváltozás: évekkel a menopauza előtt elkezdődhet, és kezelhető.","lead":"A perimenopauza a menopauzát megelőző átmeneti időszak. Évekig tarthat, és a panaszok sokszor már a 40-es években megjelennek, amikor még rendszeres lehet a menstruáció.","sections":[["Mennyire gyakori?","Egy ausztrál egészségügyi tájékoztató szerint nagyjából minden második nőnek enyhe vagy közepes, minden negyediknek pedig a mindennapokat is megnehezítő panaszai vannak. A menopauza átlagosan 51 éves korban következik be, a perimenopauza átlagosan 4–6 évig tart."],["Milyen panaszokkal járhat?","Rendszertelen ciklus, hőhullám, éjszakai izzadás, alvászavar, hangulatingadozás, koncentrációs nehézség. Nem mindenkinél jelentkezik mind, és erősségük is nagyon eltérő."],["Mi segít?","A panaszok enyhítésére hormonális és nem hormonális lehetőségek is vannak. Hogy neked mi megfelelő, azt orvosoddal közösen érdemes eldönteni."]],"watch":["A perimenopauzában is lehet teherbe esni: a fogamzásgátlásról beszélj orvosoddal.","A menopauza utáni bármilyen hüvelyi vérzést ki kell vizsgálni.","A szűréseket (méhnyak, emlő) ebben az időszakban se hagyd ki."],"doctor":"Ha a panaszok rontják az életminőségedet, ha a vérzésed nagyon erős vagy rendszertelenné válik, vagy ha a menopauza után vérzést tapasztalsz.","sources":[["Ausztrál egészségügyi tájékoztató: perimenopauza és menopauza","https://www.health.gov.au/sites/default/files/2026-05/fact-sheet-about-perimenopause-and-menopause_0.pdf"]]}],"guides":[{"id":"ttc","title":"Babatervezés","range":"A fogantatás előtt","intro":"A felkészülés már a fogantatás előtt elkezdődik: néhány vizsgálat és döntés sokat számít az első hetekben.","tips":[["Folsav már a tervezéskor","A folsav szedését már a fogantatás előtt érdemes elkezdeni, mert csökkenti a velőcső-záródási rendellenességek kockázatát. A megfelelő adagot beszéld meg orvosoddal."],["Fogamzás előtti vizsgálat","Egy nőgyógyászati vizsgálat és a szükséges laborvizsgálatok segítenek időben felismerni, amire a terhesség előtt figyelni kell."],["Védőoltások ellenőrzése","Érdemes ellenőrizni a rubeola és a bárányhimlő elleni védettséget, mert ezek az oltások terhesség alatt nem adhatók. Az oltás utáni várakozási időről orvosod tájékoztat."],["Szedett gyógyszerek","Ha rendszeresen szedsz gyógyszert, a tervezés előtt beszéld meg orvosoddal. Magadtól ne hagyd abba."]],"faq":[["Mennyi idő alatt szokás teherbe esni?","Sok pár az első évben teherbe esik. Ha 35 év alatt egy év, 35 év felett hat hónap rendszeres próbálkozás után sem jön a baba, érdemes kivizsgálást kérni."],["Kell követnem a ciklusomat?","Nem kötelező, de segíthet megismerni a termékeny napokat. Ha a ciklusod nagyon rendszertelen, jelezd orvosodnak."],["Min érdemes változtatnom?","A dohányzás és az alkohol elhagyása, a kiegyensúlyozott étkezés és a rendszeres mozgás már a tervezés idején is sokat számít."]]},{"id":"p1","title":"1. trimeszter","range":"1–13. hét","intro":"A szervek kialakulásának időszaka. Ilyenkor zajlanak az első szűrővizsgálatok is.","tips":[["Folsav már a fogantatás előtt","A folsav a fogantatás előtti hetekben és az első trimeszterben a legfontosabb: csökkenti a velőcső-záródási rendellenességek kockázatát. Az adagot beszéld meg orvosoddal."],["Első genetikai ultrahang: 11–14. hét","Ekkor mérik többek között a tarkóredő vastagságát. Vérvizsgálattal kiegészítve ez a kombinált teszt, amely a leggyakoribb kromoszóma-rendellenességek kockázatát becsüli."],["NIPT a 10. héttől","Az anyai vérből végzett, nem invazív magzati DNS-vizsgálat a 10. héttől elvégezhető. Szűrővizsgálat, nem diagnózis: eltérő eredmény esetén további vizsgálat szükséges."],["Biztonságos étkezés","A nyers vagy nem átsütött hús, a nyers tojás és a pasztőrözetlen tejtermékek kerülése csökkenti a toxoplazma- és a listeriafertőzés kockázatát."]],"faq":[["Mikor jöjjek az első vizsgálatra?","Pozitív teszt után érdemes időpontot kérni. Az első terhesgondozási vizsgálat ideálisan a 12. hét előtt történik, hogy a korai szűrések időben elkészülhessenek."],["Normális, hogy ennyire hányingerem van?","A terhességi hányinger gyakori, és sokaknál a 12–16. hét körül enyhül. Ha semmit nem tudsz magadban tartani, vagy fogysz, jelezd orvosodnak."],["Ihatok kávét?","Mérsékelten igen, de a koffeinbevitelt érdemes korlátozni. Az alkoholra viszont nincs biztonságos mennyiség a terhesség alatt."],["Mikor forduljak azonnal orvoshoz?","Erős hasi fájdalom, vérzés vagy ájulásérzés esetén ne várj: hívd a 112-t, vagy menj a legközelebbi ügyeletre."]]},{"id":"p2","title":"2. trimeszter","range":"14–27. hét","intro":"Sokan ezt tartják a legkönnyebb időszaknak. Ilyenkor érezhetők az első magzatmozgások.","tips":[["Cukorterhelés: 24–28. hét","A terhességi cukorbetegség gyakran tünetmentes, ezért fontos a szűrés. A vizsgálatra éhgyomorra kell érkezni, a pontos előkészítést orvosod adja meg."],["Második genetikai ultrahang: 18–22. hét","Ilyenkor részletesen átvizsgálják a magzat szerveit, a méhlepényt és a magzatvíz mennyiségét."],["Az első mozgások","Első terhességben a magzatmozgás jellemzően a 18–20. hét körül érezhető, ismételt terhességben gyakran korábban."],["Rh-negatív vércsoport","Ha Rh-negatív vagy, orvosod megbeszéli veled az anti-D profilaxis szükségességét és időzítését."]],"faq":[["Utazhatok repülővel?","Szövődménymentes terhességben általában igen. A késői hetekben a légitársaságok korlátozhatják az utazást, ezért indulás előtt beszéld meg orvosoddal."],["Mennyit hízhatok?","Ez a terhesség előtti testsúlyodtól függ, ezért egyénileg érdemes megbeszélni orvosoddal."],["Normális, ha néha megkeményedik a hasam?","Az alkalmanként jelentkező, fájdalmatlan keményedés (jóslófájás) normális lehet. Ha rendszeressé vagy fájdalmassá válik a 37. hét előtt, vagy vérzéssel jár, azonnal jelentkezz."],["Sportolhatok?","Szövődménymentes terhességben a rendszeres, mérsékelt mozgás kifejezetten ajánlott. Kerüld az eséssel, ütközéssel járó sportokat, és beszéld meg orvosoddal, mi biztonságos neked."]]},{"id":"p3","title":"3. trimeszter","range":"28–40. hét","intro":"A felkészülés időszaka: gyakoribbak a vizsgálatok, és egyre fontosabb figyelni a baba mozgását.","tips":[["Figyeld a mozgásokat","Ismerd meg a babád megszokott mozgásmintáját. Ha a mozgások csökkennek vagy megváltoznak, ne várj másnapig: még aznap jelentkezz."],["Oldalt fekve elalvás","A 28. héttől oldalt fekve érdemes elaludni, mert a hanyatt fekvés terhelheti a nagy ereket. Hogy bal vagy jobb oldalon, az kevésbé lényeges."],["GBS-szűrés: 35–37. hét","A B csoportú streptococcus-szűrés megmutatja, szükség van-e antibiotikumra a szülés alatt."],["CTG a terhesség végén","Az utolsó hetekben rendszeres CTG-vizsgálat követi a baba szívműködését és a méhtevékenységet."]],"faq":[["Mikor induljak a kórházba?","Ha a fájások rendszeressé válnak, elfolyik a magzatvíz, vérzést tapasztalsz, vagy kevesebbet mozog a baba. Az indulásról előre egyeztess orvosoddal és a választott szülészettel."],["Mit vigyek a szülésre?","Személyi igazolványt, TAJ-kártyát, a várandósgondozási könyvet és a leleteidet, valamint a választott kórház listája szerinti holmikat."],["Mikor forduljak azonnal orvoshoz?","Hüvelyi vérzés, magzatvízfolyás, erős fejfájás vagy látászavar, hirtelen arc- vagy kézduzzanat, illetve csökkent magzatmozgás esetén azonnal jelentkezz. Sürgős esetben hívd a 112-t."]]},{"id":"post","title":"Szülés után","range":"A gyermekágy és az első hónapok","intro":"A szülés utáni hetekben a tested és a lelked is alkalmazkodik. Ebben az időszakban rád is ugyanúgy figyelni kell, mint a babára.","tips":[["Gyermekágyi kontroll","A szülés után kb. 6 héttel javasolt nőgyógyászati kontrollvizsgálat. Ilyenkor a fogamzásgátlásról is érdemes beszélni."],["A szülés utáni vérzés","A gyermekágyi folyás hetekig tarthat, és fokozatosan halványul. Ha hirtelen erősödik, nagy alvadékok távoznak, vagy lázas leszel, azonnal jelentkezz."],["Lelki változások","Az első napokban gyakori a sírékonyság, ami általában két héten belül elmúlik. Ha a lehangoltság tartós, vagy nehéz ellátnod magad és a babát, kérj segítséget: ez kezelhető állapot."],["Medencefenék","A medencefenék-torna segíthet a vizelettartási panaszok megelőzésében. Hogy mikor kezdheted, beszéld meg orvosoddal vagy gyógytornásszal."]],"faq":[["Teherbe eshetek szoptatás alatt?","Igen. A szoptatás önmagában nem megbízható fogamzásgátlás, a számodra megfelelő módszert beszéld meg orvosoddal."],["Mikor kezdhetek újra sportolni?","Fokozatosan, a gyermekágyi kontroll után és orvosi jóváhagyással. A séta általában korábban is jót tesz."],["Mikor forduljak azonnal orvoshoz?","Erős vérzés, láz, erős hasi fájdalom, vádlifájdalom vagy -duzzanat, mellkasi fájdalom vagy nehézlégzés esetén azonnal. Sürgős esetben hívd a 112-t."]]},{"id":"gyn","title":"Nőgyógyászat","range":"Minden életszakaszban","intro":"Szűrések, megelőzés és rendszeres vizsgálatok.","tips":[["Méhnyakszűrés","A hazai szervezett szűrőprogram 25 és 65 év között háromévente javasolja a méhnyakszűrést. Orvosod ennél gyakoribb vizsgálatot is javasolhat."],["Emlőszűrés","A szervezett mammográfiás szűrés 45 és 65 év között kétévente hív be. Ha elváltozást tapasztalsz, ne várd meg a meghívót."],["HPV elleni védőoltás","A HPV elleni védőoltás a méhnyakrák megelőzésének fontos eszköze. Hogy neked ajánlott-e, beszéld meg orvosoddal."]],"faq":[["Hogyan készüljek a vizsgálatra?","A vizsgálat előtti 48 órában lehetőleg ne legyen hüvelyi kezelés, irrigálás vagy együttlét. Menstruáció alatt a méhnyakszűrés kevésbé megbízható, ilyenkor érdemes időpontot módosítani."],["Mit hozzak magammal?","TAJ-kártyát, személyi igazolványt, a korábbi leleteidet és a szedett gyógyszereid listáját. A leleteket előre is feltöltheted a Mappádba."],["Hogyan mondhatom le az időpontomat?","Az Időpont menüben bármikor. Kérjük, legalább [X] órával előtte jelezd."],["Mennyi idő alatt válaszol az orvos?","Munkanapokon általában [X] órán belül. Az üzenetküldés nem sürgős esetekre való: sürgős esetben hívd a 112-t."]]},{"id":"meno","title":"Változókor","range":"Jellemzően a 40-es évektől","intro":"A változókor évekig tartó átmenet. A panaszok sokfélék, és a legtöbbjükre van megoldás.","tips":[["Mi a perimenopauza?","A menopauzát megelőző években gyakori a rendszertelen ciklus, a hőhullám, az alvászavar és a hangulatingadozás."],["A tünetek kezelhetők","A panaszok enyhítésére hormonális és nem hormonális lehetőségek is vannak. Hogy neked mi megfelelő, azt orvosoddal közösen érdemes eldönteni."],["Csontok egészsége","Az ösztrogénszint csökkenésével nő a csontritkulás kockázata. A rendszeres mozgás és a megfelelő kalcium- és D-vitamin-bevitel segít, a részleteket beszéld meg orvosoddal."],["Szűrések továbbra is","A mammográfiás szűrés 45 és 65 év között kétévente, a méhnyakszűrés 65 éves korig háromévente javasolt."]],"faq":[["Kell még fogamzásgátlás?","Igen, a változókorban is lehetséges teherbe esni, amíg a menstruáció teljesen meg nem szűnik. Hogy meddig szükséges, beszéld meg orvosoddal."],["Normális a vérzés a menopauza után?","Nem. A menopauza utáni bármilyen hüvelyi vérzést ki kell vizsgálni, ezért kérj időpontot."],["Kihez fordulhatok a panaszaimmal?","Nőgyógyászodhoz: a hőhullámokról, az alvászavarról vagy a hangulatváltozásról is nyugodtan beszélhetsz vele."]]}],"videos":[{"id":"v1","title":"Mire számíts az első terhesgondozáson?","desc":"Milyen vizsgálatok várnak rád az első alkalommal, és mit érdemes magaddal hozni."},{"id":"v2","title":"Genetikai ultrahang és NIPT: mi a különbség?","desc":"A szűrővizsgálatok célja, időzítése, és hogy mit jelent egy eltérő eredmény."},{"id":"v3","title":"Cukorterheléses vizsgálat lépésről lépésre","desc":"Hogyan készülj, mi történik a vizsgálat napján, és mikor kapod meg az eredményt."},{"id":"v4","title":"Mit néz az orvos a második genetikai ultrahangon?","desc":"A 18–22. heti részletes vizsgálat menete, érthetően elmagyarázva."},{"id":"v5","title":"A magzatmozgások figyelése","desc":"Hogyan ismerd meg a babád mozgásmintáját, és mikor jelentkezz azonnal."},{"id":"v6","title":"Készülés a szülésre","desc":"Mikor indulj, mit vigyél, és mire figyelj az utolsó hetekben."},{"id":"v7","title":"Méhnyakszűrés: mi történik a vizsgálaton?","desc":"A citológiai vizsgálat menete és az előkészület."},{"id":"v8","title":"Fogamzás előtti felkészülés: mire figyelj?","desc":"A tervezés előtti vizsgálatok, a folsav és a védőoltások, röviden."},{"id":"v9","title":"Az első hetek a szülés után","desc":"Gyermekágyi vérzés, kontrollvizsgálat, és mikor kérj azonnal segítséget."},{"id":"v10","title":"Változókor: tünetek és kezelési lehetőségek","desc":"Mi zajlik a szervezetben, és milyen lehetőségek enyhíthetik a panaszokat."},{"id":"v11","title":"Fogamzásgátlási módszerek áttekintése","desc":"A gyakori módszerek előnyei és korlátai, hogy felkészülten érkezz a tanácsadásra."}],"services":["Terhesgondozási vizsgálat","Genetikai ultrahang","Nőgyógyászati vizsgálat","Méhnyakszűrés (citológia)","Fogamzásgátlási tanácsadás","Leletmegbeszélés","Fogamzás előtti tanácsadás","Gyermekágyi kontroll","Változókori konzultáció"]};

function seedPatients(appts) {
  const seen = {};
  const out = [];
  appts.forEach((a, i) => {
    if (seen[a.name]) return;
    seen[a.name] = true;
    out.push({
      id: 'u' + (i + 1), name: a.name, phone: '+36 30 000 00' + String(i + 1).padStart(2, '0'), linked: a.linked,
      docs: a.linked && i % 2 === 1 ? [{ name: 'Vérkép', cat: 'Labor', date: 'okt. 28.' }] : [],
      consents: [['ÁSZF', '1.0 változat · [dátum]'], ['Adatkezelési tájékoztató', '1.0 változat · [dátum]']].concat(a.pay === 'deposit' ? [['Lemondási feltételek', '1.0 változat · [dátum]']] : [])
    });
  });
  return out;
}

function seedContent() {
  const out = [];
  SEED.articles.forEach((a) => out.push({
    id: 'a-' + a.id, kind: 'article', title: a.title, stat: a.stat, short: a.short, lead: a.lead,
    sections: a.sections.map((x) => [x[0], x[1]]), watch: a.watch.slice(), doctor: a.doctor,
    sources: a.sources.map((x) => [x[0], x[1]]), status: 'review', reviewed: ''
  }));
  SEED.guides.forEach((g) => out.push({
    id: 'g-' + g.id, kind: 'guide', title: g.title, stat: g.range, short: g.intro, lead: '',
    sections: g.tips.map((x) => [x[0], x[1]]).concat(g.faq.map((x) => ['Gyakori kérdés: ' + x[0], x[1]])),
    watch: [], doctor: '', sources: [], status: 'review', reviewed: ''
  }));
  SEED.videos.forEach((v) => out.push({

    sections: [], watch: [], doctor: '', sources: [], status: 'draft', reviewed: ''
  }));
  return out;
}
