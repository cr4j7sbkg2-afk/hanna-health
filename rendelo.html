    const calDenied = !isDoctor && (
      (sel && (!can('cal.book') || !can('cal.cancel') || (sel.pay === 'pending' && !can('pay.link')) || (!sel.linked && !sel.code && !can('id.link')) || (sel.pay === 'deposit' && !can('pay.refund'))))
      || (slotFree && (!can('cal.book') || !can('cal.block'))));

    // ---------- Üzenetek ----------
    const thread = s.threads.find((x) => x.id === s.threadId) || s.threads[0];
    const unreadCount = s.threads.filter((x) => x.unread).length;
    const openThreads = s.threads.filter((x) => !x.closed).length;
    const threads = s.threads.map((x) => {
      const last = x.msgs[x.msgs.length - 1];
      const tg = x.closed ? ['Lezárva', 'neutral'] : (x.unread ? ['Új', 'warm'] : ['Megválaszolva', 'cool']);
      const p = pill(tg[1]);
      const on = x.id === thread.id;
      return {
        name: x.name, weight: x.unread ? '600' : '400', snippet: last.text.length > 64 ? last.text.slice(0, 64) + '…' : last.text,
        tag: tg[0], tagBg: p.bg, tagColor: p.color, bg: on ? t.rowOn : t.surface, pressed: on ? 'true' : 'false',
        onOpen: () => this.setState({
          threadId: x.id, reply: '',
          threads: this.state.threads.map((y) => (y.id === x.id ? Object.assign({}, y, { unread: false }) : y))
        })
      };
    });
    const threadMsgs = thread.msgs.map((m) => (m.from === 'doc'
      ? { text: m.text, meta: 'Te · ' + m.time, align: 'flex-end', bg: t.primary, color: '#FFFFFF', metaColor: '#DADBEA' }
      : { text: m.text, meta: thread.name + ' · ' + m.time, align: 'flex-start', bg: t.track, color: t.text, metaColor: t.muted }));
    const sendReply = () => {
      const st = this.state;
      const txt = st.reply.trim();
      if (!txt || !can('msg.read')) return;
      this.setState({
        reply: '',
        threads: st.threads.map((y) => (y.id === thread.id
          ? Object.assign({}, y, { unread: false, msgs: y.msgs.concat([{ from: 'doc', text: txt, time: 'most' }]) })
          : y))
      });
    };

    // ---------- Moderálás ----------
    const inFilter = (x, f) => (f === 'done' ? x.state === 'done' : x.state === 'pending' && (f === 'pending' ? x.type === 'first' : x.type !== 'first'));
    const pendingMod = s.modItems.filter((x) => x.state === 'pending');
    const patchMod = (id, patch) => this.setState({ modItems: this.state.modItems.map((x) => (x.id === id ? Object.assign({}, x, patch) : x)) });
    const resolve = (id, outcome) => patchMod(id, { state: 'done', outcome: outcome + ' · ' + who + ', most' });
    const modItems = s.modItems.filter((x) => inFilter(x, s.modFilter)).map((x) => {
      const k = x.type === 'first' ? ['Első hozzászólás', 'cool'] : (x.type === 'crisis' ? ['Válságjelzés', 'solid'] : ['Jelentett', 'warm']);
      const p = pill(k[1]);
      const crisis = x.type === 'crisis';
      const okAct = crisis ? can('mod.crisis') : can('mod.act');
      return {
        kind: k[0], kindBg: p.bg, kindColor: p.color,
        meta: x.space + ' · ' + x.author + ' · ' + x.time, text: x.text,
        reason: x.reason + (x.notified ? ' Az orvos értesítve.' : ''),
        isCrisis: crisis, isPending: x.state === 'pending', isDone: x.state === 'done',
        showApprove: !crisis, approveBtn: act(can('mod.act'), true),
        hideBtn: act(okAct, false), hideLabel: crisis ? 'Rejtve marad, lezárom' : 'Elrejtem',
        showNotify: crisis && !isDoctor, notifyLabel: x.notified ? 'Orvos értesítve' : 'Orvos értesítése',
        outcome: x.outcome,
        onApprove: () => { if (can('mod.act')) resolve(x.id, 'Megjelenhet'); },
        onHide: () => { if (okAct) resolve(x.id, crisis ? 'Rejtve maradt, az orvos felvette a kapcsolatot a szerzővel' : 'Elrejtve, a szerző értesítést kapott az okról'); },
        onNotify: () => patchMod(x.id, { notified: true })
      };
    });
    const modFilters = [['pending', 'Jóváhagyásra vár'], ['reported', 'Jelentett'], ['done', 'Lezárt']].map((f) => Object.assign(
      { label: f[1] + ' (' + s.modItems.filter((x) => inFilter(x, f[0])).length + ')' }, chip(s.modFilter === f[0]), { onPick: () => set({ modFilter: f[0] }) }));

    // ---------- Tartalom ----------
    const cur = s.content.find((c) => c.id === s.contentId) || s.content[0];
    const stOf = (c) => { const x = STATUS[c.status] || STATUS.draft; const p = pill(x[1]); return { status: x[0], stBg: p.bg, stColor: p.color }; };
    const canEdit = can('content.edit');
    const canPublish = can('content.publish');
    const mut = (fn, note) => {
      if (!canEdit) return;
      const st = this.state;
      this.setState({
        content: st.content.map((c) => {
          if (c.id !== cur.id) return c;
          const n = Object.assign({}, c, { sections: c.sections.map((x) => x.slice()), watch: c.watch.slice(), sources: c.sources.map((x) => x.slice()) });
          fn(n);
          return n;
        }),
        edNote: note === undefined ? st.edNote : note
      });
    };
    const reviewCount = s.content.filter((c) => c.status === 'review').length;
    const liveCount = s.content.filter((c) => c.status === 'live').length;
    const contentItems = s.content.filter((c) => s.contentFilter === 'all' || c.kind === s.contentFilter).map((c) => Object.assign({
      title: c.title,
      meta: KIND_NAME[c.kind] + (c.reviewed ? ' · lektorálva: ' + c.reviewed : ''),
      bg: c.id === cur.id ? t.rowOn : t.surface, pressed: c.id === cur.id ? 'true' : 'false',
      onOpen: () => set({ contentId: c.id, edNote: '' })
    }, stOf(c)));
    const contentFilters = [['all', 'Mind'], ['article', 'Cikkek'], ['guide', 'Útmutatók'], ['video', 'Videók']].map((f) => Object.assign(
      { label: f[1] }, chip(s.contentFilter === f[0]), { onPick: () => set({ contentFilter: f[0] }) }));
    const isLive = cur.status === 'live';

    // ---------- Jogosultságok ----------
    const permRows = PERMS.map((p) => {
      const fixed = p[3];
      const on = fixed ? fixed === 'yes' : !!s.perm[p[0]];
      const toggle = isDoctor && !fixed;
      return {
        label: p[2], group: p[1], isToggle: toggle, isFixed: !toggle,
        admText: on ? (toggle ? 'Engedélyezve' : 'Igen') : (toggle ? 'Tiltva' : 'Nem'),
        fixedNote: fixed ? 'rögzített, nem módosítható' : 'az orvos módosíthatja',
        pressed: on ? 'true' : 'false', aria: p[2] + ' az adminisztrátornak: ' + (on ? 'engedélyezve' : 'tiltva'),
        bg: on ? t.primary : t.surface, color: on ? '#FFFFFF' : t.text, border: on ? t.primary : t.border,
        onToggle: () => {
          if (!toggle) return;
          const np = Object.assign({}, this.state.perm);
          np[p[0]] = !np[p[0]];
          this.setState({ perm: np });
        }
      };
    });

    // ---------- Páciensek ----------
    const pq = s.patQuery.trim().toLowerCase();
    const pqDigits = pq.replace(/\D/g, '');
    const patShown = s.patients.filter((x) => !pq || x.name.toLowerCase().indexOf(pq) >= 0 || (pqDigits && x.phone.replace(/\D/g, '').indexOf(pqDigits) >= 0));
    const pat = s.patients.find((x) => x.id === s.patId) || s.patients[0];
    const patApptList = s.appts.filter((a) => a.name === pat.name);
    const issueOk = can('doc.issue') && s.issueName.trim().length > 1;

    // ---------- Adatkérések ----------
    const openReq = s.requests.filter((x) => x.state === 'open').length;
    const reqRows = s.requests.map((x) => {
      const del = x.type === 'delete';
      const p = pill(del ? 'warm' : 'cool');
      return {
        kind: del ? 'Fióktörlés' : 'Adatletöltés', kindBg: p.bg, kindColor: p.color, name: x.name,
        meta: 'Beérkezett: ' + x.received + ' · határidő: ' + x.due,
        text: del
          ? 'A páciens a fiókja és a Mappája törlését kérte. A törlés az appban tárolt adatokra vonatkozik; a rendelő jogszabály szerint megőrzendő orvosi dokumentációját nem érinti (ezt jogi tanácsadóval ellenőrizni kell).'
          : 'A páciens az appban kezelt adatai másolatát kérte. A csomag a fiókadatokat, a foglalásokat, az üzeneteket és a Mappa tartalmát tartalmazza.',
        isOpen: x.state === 'open', isDone: x.state === 'done', outcome: x.outcome,
        doneBtn: act(can('gdpr.handle'), true), doneLabel: del ? 'Töröltem, lezárom' : 'Elküldtem, lezárom',
        onDone: () => {
          if (!can('gdpr.handle')) return;
          this.setState({ requests: this.state.requests.map((y) => (y.id === x.id ? Object.assign({}, y, { state: 'done', outcome: 'Teljesítve · ' + who + ', most. A páciens visszaigazolást kapott.' }) : y)) });
        }
      };
    });

    // ---------- Kimutatások ----------
    const noShows = s.appts.filter((a) => a.noShow).length;
    const fbAvg = s.feedback.length ? (s.feedback.reduce((x, y) => x + y, 0) / s.feedback.length).toFixed(1).replace('.', ',') : '–';
    const svcCount = {};
    s.appts.forEach((a) => { svcCount[a.svc] = (svcCount[a.svc] || 0) + 1; });
    const statTiles = [
      ['Foglalások a héten', String(s.appts.length), freeCount + ' szabad időpont'],
      ['Lemondások', String(s.counts.cancelled), 'a rendelő által lemondva'],
      ['Áthelyezések', String(s.counts.moved), 'a rendelő által áthelyezve'],
      ['Meg nem jelenések', String(noShows), 'rögzítve a naptárban'],
      ['Nyitott beszélgetések', String(openThreads), unreadCount + ' megválaszolatlan'],
      ['Átlagos válaszidő', '[X] óra', 'éles adatokból számolható'],
      ['Elégedettség', fbAvg + ' / 5', s.feedback.length + ' visszajelzés alapján'],
      ['Moderálásra vár', String(pendingMod.length), reviewCount + ' anyag lektorálásra vár']
    ].map((x) => ({ label: x[0], value: x[1], sub: x[2] }));

    const subName = s.sub.name.trim() || '[helyettes orvos neve]';
    const tabs = [
      ['cal', 'Naptár', 0],
      ['pat', 'Páciensek', 0],
      ['msgs', 'Üzenetek', can('msg.read') ? unreadCount : 0],
      ['mod', 'Moderálás', pendingMod.length],
      ['content', 'Tartalom', canPublish ? reviewCount : 0],
      ['req', 'Adatkérések', openReq],
      ['stats', 'Kimutatások', 0],
      ['perms', 'Jogosultságok', 0]
    ];

    return {
      t: t,
      userName: isDoctor ? 'Dr. Schmek Lilian Hanna' : 'Adminisztrátor (recepció)',
      roles: [['doctor', 'Orvos'], ['admin', 'Adminisztrátor']].map((r) => ({
        label: r[1], pressed: role === r[0] ? 'true' : 'false',
        bg: role === r[0] ? '#FFFFFF' : 'transparent', color: role === r[0] ? t.primary : '#FFFFFF', weight: role === r[0] ? '600' : '400',
        onPick: () => set({ role: r[0], moveId: null })
      })),
      navItems: tabs.map((x) => ({
        label: x[1], badge: String(x[2]), hasBadge: x[2] > 0,
        current: s.tab === x[0] ? 'page' : 'false',
        bg: s.tab === x[0] ? '#FFFFFF' : 'transparent', color: s.tab === x[0] ? t.primary : '#FFFFFF', weight: s.tab === x[0] ? '600' : '400',
        onPick: () => set({ tab: x[0] })
      })),
      isPat: s.tab === 'pat', isReq: s.tab === 'req', isStats: s.tab === 'stats',
      patSummary: s.patients.length + ' páciens · ' + s.patients.filter((x) => x.linked).length + ' azonosított',
      patQuery: s.patQuery, onPatQuery: (e) => set({ patQuery: e.target.value }),
      patRows: patShown.map((x) => {
        const p = pill(x.linked ? 'cool' : 'warm');
        return {
          name: x.name, meta: x.phone + ' · ' + s.appts.filter((a) => a.name === x.name).length + ' foglalás',
          idLabel: x.linked ? 'Azonosított' : 'Új páciens', idBg: p.bg, idColor: p.color,
          bg: x.id === pat.id ? t.rowOn : t.surface, pressed: x.id === pat.id ? 'true' : 'false',
          onOpen: () => set({ patId: x.id, patNote: '', issueName: '' })
        };
      }),
      noPatRows: patShown.length === 0,
      pat: {
        name: pat.name, meta: pat.phone + ' · ' + (pat.linked ? 'azonosított páciens' : 'még nincs azonosítva'),
        noAppts: patApptList.length === 0, noDocs: pat.docs.length === 0, canIssue: !!pat.linked, notLinked: !pat.linked
      },
      patAppts: patApptList.map((a) => ({ svc: a.svc, when: dayOf(a.dayId).date + ' ' + a.time })),
      patDocs: pat.docs.map((d) => ({ name: d.name, meta: d.cat + ' · ' + d.date })),
      patConsents: pat.consents.length ? pat.consents.map((c) => ({ doc: c[0], meta: c[1] })) : [{ doc: 'Telefonon felvett páciens', meta: 'az appban még nem fogadott el dokumentumot' }],
      issueName: s.issueName, onIssueName: (e) => set({ issueName: e.target.value }),
      issueCats: DOC_CATS.map((c) => Object.assign({ label: c }, chip(s.issueCat === c), { onPick: () => set({ issueCat: c }) })),
      issueBtn: act(issueOk, true),
      issueDoc: () => {
        const st = this.state;
        if (!can('doc.issue') || st.issueName.trim().length < 2 || !pat.linked) return;
        this.setState({
          patients: st.patients.map((x) => (x.id === pat.id ? Object.assign({}, x, { docs: [{ name: st.issueName.trim(), cat: st.issueCat, date: 'ma' }].concat(x.docs) }) : x)),
          issueName: '', patNote: 'A leletet kiadtuk ' + pat.name + ' Mappájába, a páciens értesítést kapott. Rögzítve: ' + who + '.'
        });
      },
      patNote: s.patNote, hasPatNote: !!s.patNote,
      reqRows: reqRows, reqDenied: !can('gdpr.handle'),
      statTiles: statTiles,
      svcRows: Object.keys(svcCount).sort((a, b) => svcCount[b] - svcCount[a]).map((k) => ({ name: k, count: String(svcCount[k]) })),
      subOn: !!s.sub.on,
      subBanner: 'Helyettesítés aktív' + (s.sub.to.trim() ? ' eddig: ' + s.sub.to.trim() : '') + '. Az üzenetekre ' + subName + ' válaszol, és ő lektorálja a tartalmat. A páciensek ezt az üzeneteknél látják.',
      subName: s.sub.name, subTo: s.sub.to,
      onSubName: (e) => { if (isDoctor) set({ sub: Object.assign({}, this.state.sub, { name: e.target.value }) }); },
      onSubTo: (e) => { if (isDoctor) set({ sub: Object.assign({}, this.state.sub, { to: e.target.value }) }); },
      subBtn: act(isDoctor, !s.sub.on),
      subLabel: s.sub.on ? 'Helyettesítés kikapcsolása' : 'Helyettesítés bekapcsolása',
      subState: s.sub.on ? 'Bekapcsolva: ' + subName : (isDoctor ? 'Kikapcsolva' : 'Kikapcsolva · csak az orvos állíthatja'),
      toggleSub: () => { if (isDoctor) set({ sub: Object.assign({}, this.state.sub, { on: !this.state.sub.on }) }); },
      isCal: s.tab === 'cal', isMsgs: s.tab === 'msgs', isMod: s.tab === 'mod', isContent: s.tab === 'content', isPerms: s.tab === 'perms',

      calSummary: 'Hét: nov. 2–6. · ' + s.appts.length + ' foglalás · ' + freeCount + ' szabad időpont · várólistán ' + WAITLIST + ' páciens',
      prepRows: SAMPLE_PREP.map((x) => ({ q: x[0], a: x[1] })),
      gridHeads: DAYS.map((d) => ({ dow: d.dow, date: d.date })),
      gridTimes: TIMES.map((tm) => ({ time: tm })),
      gridCells: gridCells,
      legend: [[t.cool, 'Azonosított páciens'], [t.accentSoft, 'Új páciens'], [t.surface, 'Szabad'], [t.track, 'Zárolva']].map((l) => ({ bg: l[0], label: l[1] })),
      isMoving: !!moving,
      moveText: moving ? moving.name + ' foglalását helyezed át. Kattints egy szabad időpontra a rácsban.' : '',
      cancelMove: () => set({ moveId: null }),
      panelNone: !sel && !slotFree, panelAppt: !!sel, panelFree: !!slotFree && !slotBlocked, panelBlocked: slotBlocked,
      sel: selVals,
      slotWhen: slotParts ? dayOf(slotParts[0]).dow + ', ' + dayOf(slotParts[0]).date + ' ' + slotParts[1] : '',
      nbName: s.nbName, onNbName: (e) => set({ nbName: e.target.value }),
      nbServices: SEED.services.map((n) => Object.assign({ label: n }, chip(s.nbSvc === n), { onPick: () => set({ nbSvc: n }) })),
      nbNew: { pressed: s.nbNew ? 'true' : 'false', box: s.nbNew ? t.primary : 'transparent', vis: s.nbNew ? 'visible' : 'hidden' },
      toggleNbNew: () => this.setState({ nbNew: !this.state.nbNew }),
      nbPayHint: nbNeedsDeposit ? 'Ehhez a foglaláshoz előleg tartozik: a páciens fizetési linket kap.' : 'Fizetés a helyszínen, előleg nem kell.',
      nbSave: act(nbOk, true), saveBooking: saveBooking,
      blockBtn: act(can('cal.block'), false),
      toggleBlock: () => {
        const st = this.state;
        if (!st.slotKey || !can('cal.block')) return;
        const b = Object.assign({}, st.blocked);
        if (b[st.slotKey]) delete b[st.slotKey]; else b[st.slotKey] = true;
        this.setState({ blocked: b, calNote: b[st.slotKey] ? 'Az időpontot zároltuk.' : 'A zárolást feloldottuk.' });
      },
      calDenied: !!calDenied,
      calNote: s.calNote, hasCalNote: !!s.calNote,

      msgsLocked: !can('msg.read'), msgsOpen: can('msg.read'),
      lockedCount: openThreads + ' nyitott beszélgetés vár az orvosra.',
      threads: threads,
      thread: {
        name: thread.name, meta: thread.meta, isOpen: !thread.closed, isClosed: !!thread.closed,
        closeLabel: thread.closed ? 'Újranyitás' : 'Lezárás',
        onToggleClosed: () => this.setState({
          threads: this.state.threads.map((y) => (y.id === thread.id ? Object.assign({}, y, { closed: !y.closed, unread: false }) : y))
        })
      },
      threadMsgs: threadMsgs,
      quick: QUICK.map((q) => ({ label: q[0], onPick: () => set({ reply: q[1] }) })),
      reply: s.reply, onReply: (e) => set({ reply: e.target.value }),
      sendReply: sendReply, sendBtn: act(s.reply.trim().length > 0, true),

      modFilters: modFilters, modItems: modItems, noModItems: modItems.length === 0,

      contentSummary: s.content.length + ' anyag · ' + reviewCount + ' lektorálásra vár · ' + liveCount + ' közzétéve. A páciens csak a közzétett anyagot látja.',
      contentFilters: contentFilters, contentItems: contentItems,
      ed: Object.assign({
        kind: KIND_LABEL[cur.kind] || 'ANYAG', title: cur.title, stat: cur.stat, short: cur.short, lead: cur.lead, doctor: cur.doctor,
        statLabel: cur.kind === 'article' ? 'Gyakoriság (kiemelt adat a cikk tetején)' : (cur.kind === 'video' ? 'Videó hossza' : 'Időszak'),
        readOnly: !canEdit,
        reviewLine: cur.reviewed ? 'Szakmai ellenőrzés: ' + cur.reviewed : 'Szakmai ellenőrzés: még nem történt meg. Lektorálás nélkül az anyag nem tehető közzé.',
        draftBtn: act(canEdit, false),
        reviewBtn: act(canEdit && cur.status === 'draft', false),
        publishBtn: act(canPublish, true),
        publishLabel: isLive ? 'Visszavonom a közzétételt' : 'Lektoráltam, közzéteszem',
        adminNote: !canPublish
      }, stOf(cur)),
      onEdTitle: (e) => mut((c) => { c.title = e.target.value; }),
      onEdStat: (e) => mut((c) => { c.stat = e.target.value; }),
      onEdShort: (e) => mut((c) => { c.short = e.target.value; }),
      onEdLead: (e) => mut((c) => { c.lead = e.target.value; }),
      onEdDoctor: (e) => mut((c) => { c.doctor = e.target.value; }),
      edSections: cur.sections.map((x, i) => ({
        n: String(i + 1), hid: 'hh-adm-sec-' + i, h: x[0], p: x[1], pLabel: (i + 1) + '. szakasz szövege',
        onH: (e) => mut((c) => { c.sections[i][0] = e.target.value; }),
        onP: (e) => mut((c) => { c.sections[i][1] = e.target.value; }),
        onRemove: () => mut((c) => { c.sections.splice(i, 1); })
      })),
      addSection: () => mut((c) => { c.sections.push(['', '']); }),
      edWatch: cur.watch.map((x, i) => ({
        text: x, label: 'Mire figyelj, ' + (i + 1) + '. pont',
        onText: (e) => mut((c) => { c.watch[i] = e.target.value; }),
        onRemove: () => mut((c) => { c.watch.splice(i, 1); })
      })),
      addWatch: () => mut((c) => { c.watch.push(''); }),
      edSources: cur.sources.map((x, i) => ({
        name: x[0], url: x[1], nameLabel: (i + 1) + '. forrás neve', urlLabel: (i + 1) + '. forrás webcíme',
        onName: (e) => mut((c) => { c.sources[i][0] = e.target.value; }),
        onUrl: (e) => mut((c) => { c.sources[i][1] = e.target.value; }),
        onRemove: () => mut((c) => { c.sources.splice(i, 1); })
      })),
      addSource: () => mut((c) => { c.sources.push(['', '']); }),
      edSaveDraft: () => mut((c) => { c.status = 'draft'; c.reviewed = ''; }, 'Vázlatként mentve. A páciensek nem látják.'),
      edSendReview: () => { if (cur.status === 'draft') mut((c) => { c.status = 'review'; }, 'Elküldve lektorálásra az orvosnak.'); },
      edPublish: () => {
        if (!canPublish) return;
        if (isLive) mut((c) => { c.status = 'draft'; c.reviewed = ''; }, 'A közzétételt visszavontad, az anyag újra vázlat.');
        else mut((c) => { c.status = 'live'; c.reviewed = 'ma · Dr. Schmek Lilian Hanna'; }, 'Közzétéve. Az anyag megjelent a páciensek Tudástárában.');
      },
      edNote: s.edNote, hasEdNote: !!s.edNote,

      permLead: isDoctor
        ? 'Itt állítod be, mit tehet meg az adminisztrátor. A változás azonnal érvényes: váltson át az Adminisztrátor szerepkörre a bal alsó sarokban, és látod a hatását.'
        : 'Ezt a táblát csak az orvos módosíthatja. Itt látod, mihez van jogosultságod.',
      permRows: permRows
    };
  }
}

</script>
<script>

(function () {
  var mount = document.getElementById('app');
  if (!window.preact) {
    mount.innerHTML = '<p class="boot">Nem sikerült betölteni az appot. Ellenőrizd az internetkapcsolatot, és töltsd újra az oldalt.</p>';
    return;
  }
  var h = preact.h;
  var root = document.getElementById('tpl').content.firstElementChild;
  var EVENTS = { onclick: 'onClick', onkeydown: 'onKeyDown', onchange: 'onChange' };
  var ONE = /^\{\{\s*([^}]+?)\s*\}\}$/;
  var ANY = /\{\{\s*([^}]+?)\s*\}\}/g;
  var ids = new WeakMap(), nextId = 0;
  function idOf(n) { if (!ids.has(n)) ids.set(n, 'n' + (nextId++)); return ids.get(n); }

  function lookup(path, scope, vals) {
    if (path === 'true') return true;
    if (path === 'false') return false;
    var parts = path.split('.');
    var v = Object.prototype.hasOwnProperty.call(scope, parts[0]) ? scope : vals;
    for (var i = 0; i < parts.length; i++) { if (v == null) return undefined; v = v[parts[i]]; }
    return v;
  }
  function interp(str, scope, vals) {
    var m = str.match(ONE);
    if (m) return lookup(m[1], scope, vals);
    return str.replace(ANY, function (_, p) { var v = lookup(p, scope, vals); return v == null ? '' : String(v); });
  }
  function kids(node, scope, vals, out, prefix) {
    var c = node.childNodes;
    for (var i = 0; i < c.length; i++) build(c[i], scope, vals, out, prefix ? prefix + ':' + i : null);
  }
  function build(node, scope, vals, out, key) {
    if (node.nodeType === 3) {
      var t = node.nodeValue;
      if (t.indexOf('{{') >= 0) { var r = interp(t, scope, vals); out.push(r == null ? '' : String(r)); }
      else out.push(t);
      return;
    }
    if (node.nodeType !== 1) return;
    var tag = node.localName;
    if (tag === 'sc-if') {
      if (interp(node.getAttribute('value'), scope, vals)) kids(node, scope, vals, out, idOf(node));
      return;
    }
    if (tag === 'sc-for') {
      var list = interp(node.getAttribute('list'), scope, vals) || [];
      var as = node.getAttribute('as');
      for (var j = 0; j < list.length; j++) {
        var s = Object.assign({}, scope); s[as] = list[j];
        kids(node, s, vals, out, null);
      }
      return;
    }
    var props = {};
    if (key) props.key = key;
    for (var k = 0; k < node.attributes.length; k++) {
      var a = node.attributes[k], name = a.name;
      if (name.indexOf('hint-') === 0) continue;
      var val = a.value.indexOf('{{') >= 0 ? interp(a.value, scope, vals) : a.value;
      if (EVENTS[name]) {
        name = EVENTS[name];
        if (name === 'onChange' && (tag === 'textarea' || (tag === 'input' && node.getAttribute('type') !== 'file'))) name = 'onInput';
      } else if (name === 'disabled') {
        val = val === true || val === 'true';
      }
      props[name] = val;
    }
    var children = [];
    kids(node, scope, vals, children, null);
    out.push(h(tag, props, children));
  }

  var comp = new Component({ variant: 'holdciklus' });
  var lastView = '';
  function draw() {
    var vals = comp.renderVals();
    var out = [];
    build(root, {}, vals, out, null);
    preact.render(out[0], mount);
    var s = comp.state;
    var view = [s.tab, s.kbView, s.videoId, s.articleId, s.forumView, s.threadId, s.liliView, s.step, s.onboard, s.mapUnlocked, s.linked].join('|');
    if (view !== lastView) {
      lastView = view;
      var screen = mount.querySelector("main");
      if (screen) screen.scrollTop = 0;
    }
  }
  var queued = false;
  window.__dcRender = function () {
    if (queued) return;
    queued = true;
    requestAnimationFrame(function () { queued = false; draw(); });
  };
  mount.innerHTML = '';
  draw();
})();

</script>
